name: Build JXL snake artifact

on:
  push:
    branches:
      - tmp-jxl-snake-art
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JPEG XL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libjxl-devtools libjxl-tools

      - name: Generate prediction-tree program
        run: python3 jxl_snake.py

      - name: Compile native JXL art
        shell: bash
        run: |
          set -o pipefail
          jxl_from_tree snake.tree snake.jxl 2>&1 | tee compile.log

      - name: Decode preview
        shell: bash
        run: |
          set -o pipefail
          djxl snake.jxl snake.png 2>&1 | tee decode.log

      - name: Record sizes and hashes
        shell: bash
        run: |
          {
            echo "JXL bytes: $(stat -c %s snake.jxl)"
            echo "Tree source bytes: $(stat -c %s snake.tree)"
            sha256sum snake.jxl snake.png snake.tree
            jxlinfo snake.jxl || true
          } | tee build-info.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jxl-snake-art
          path: |
            snake.jxl
            snake.png
            snake.tree
            jxl_snake.py
            build-info.txt
            compile.log
            decode.log
          if-no-files-found: warn
          retention-days: 1
